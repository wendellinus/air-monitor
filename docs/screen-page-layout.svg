<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <style>
      .bg { fill: #0b1220; }
      .panel { fill: rgba(255,255,255,0.05); stroke: rgba(255,255,255,0.18); stroke-width: 2; }
      .panel2 { fill: rgba(255,255,255,0.03); stroke: rgba(255,255,255,0.14); stroke-width: 2; }
      .accent { stroke: rgba(61,217,255,0.75); stroke-width: 3; fill: rgba(61,217,255,0.10); }
      .warn { stroke: rgba(255,90,122,0.65); stroke-width: 3; fill: rgba(255,90,122,0.08); }
      .text { fill: rgba(255,255,255,0.90); font: 600 16px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
      .muted { fill: rgba(255,255,255,0.70); font: 500 13px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
      .small { fill: rgba(255,255,255,0.62); font: 500 12px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
      .mono { fill: rgba(255,255,255,0.62); font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .dash { stroke: rgba(255,255,255,0.18); stroke-width: 2; stroke-dasharray: 8 8; fill: none; }
      .arrow { stroke: rgba(255,255,255,0.55); stroke-width: 2; fill: none; marker-end: url(#mArrow); }
      .chip { fill: rgba(0,0,0,0.35); stroke: rgba(255,255,255,0.18); stroke-width: 2; }
    </style>
    <marker id="mArrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="2"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect class="bg" x="0" y="0" width="1920" height="1080" />

  <!-- Header -->
  <rect class="panel" x="24" y="18" width="1872" height="64" rx="18" />
  <text class="text" x="48" y="58">AIR MONITOR</text>
  <text class="muted" x="220" y="58">公告 / 跑马灯</text>
  <rect class="chip" x="1600" y="32" width="180" height="36" rx="18" />
  <text class="small" x="1620" y="55">时间</text>
  <rect class="chip" x="1788" y="32" width="92" height="36" rx="18" />
  <text class="small" x="1808" y="55">管理后台</text>

  <!-- Main area -->
  <rect class="panel2" x="24" y="96" width="1872" height="960" rx="22" />
  <text class="mono" x="48" y="130">Main: absolute map layer + UI overlay</text>

  <!-- Left column -->
  <rect class="panel" x="48" y="120" width="320" height="912" rx="22" />
  <text class="text" x="72" y="156">左侧栏</text>
  <text class="small" x="72" y="178">固定宽度，内部滚动（列表）</text>

  <rect class="panel2" x="72" y="196" width="272" height="260" rx="18" />
  <text class="muted" x="92" y="230">城市概览卡</text>
  <rect class="accent" x="92" y="248" width="232" height="76" rx="16" />
  <text class="small" x="112" y="294">AQI + 等级</text>
  <rect class="panel2" x="92" y="336" width="232" height="92" rx="16" />
  <text class="small" x="112" y="368">PM2.5 / PM10 / O3</text>

  <rect class="panel2" x="72" y="472" width="272" height="540" rx="18" />
  <text class="muted" x="92" y="506">热门城市列表</text>
  <text class="small" x="92" y="526">ScrollArea（wheel 事件不冒泡到地图）</text>
  <rect class="dash" x="92" y="544" width="232" height="444" rx="14" />
  <text class="small" x="112" y="580">按钮列表（可滚动）</text>

  <!-- Center map -->
  <rect class="panel" x="392" y="120" width="1120" height="912" rx="22" />
  <text class="text" x="416" y="156">地图区域（AMap）</text>
  <text class="small" x="416" y="178">地图是底层 layer；UI 叠在上面</text>

  <rect class="accent" x="880" y="520" width="90" height="90" rx="45" />
  <text class="small" x="898" y="572">预警点</text>
  <rect class="panel2" x="820" y="640" width="210" height="52" rx="20" />
  <text class="small" x="842" y="672">城市点位 / 定位点位</text>

  <!-- Right column -->
  <rect class="panel" x="1536" y="120" width="336" height="912" rx="22" />
  <text class="text" x="1560" y="156">右侧栏</text>
  <text class="small" x="1560" y="178">整体单滚动容器（避免嵌套滚动）</text>

  <rect class="panel2" x="1560" y="196" width="288" height="250" rx="18" />
  <text class="muted" x="1580" y="230">AQI 趋势（ECharts）</text>
  <text class="small" x="1580" y="252">高度: clamp(150px, 22vh, 230px)</text>

  <rect class="panel2" x="1560" y="464" width="288" height="250" rx="18" />
  <text class="muted" x="1580" y="498">污染物浓度（ECharts）</text>
  <text class="small" x="1580" y="520">同上（可压缩）</text>

  <rect class="warn" x="1560" y="732" width="288" height="280" rx="18" />
  <text class="text" x="1580" y="766">图例说明（可滚动区域内）</text>
  <text class="small" x="1580" y="788">内容多时，滚动右侧栏查看完整</text>
  <rect class="dash" x="1580" y="806" width="248" height="168" rx="14" />
  <text class="small" x="1600" y="842">图标 + 名称 + 说明（2 列网格）</text>
  <text class="small" x="1600" y="864">热门城市 / 定位 / 预警类型...</text>
  <rect class="panel2" x="1580" y="982" width="248" height="34" rx="14" />
  <text class="small" x="1600" y="1005">底部说明（角标/颜色）</text>

  <!-- Interaction notes -->
  <path class="arrow" d="M1650 188 L1650 210" />
  <text class="small" x="1664" y="210">右侧整体滚动</text>

  <path class="arrow" d="M290 538 L290 560" />
  <text class="small" x="304" y="560">左侧列表滚动</text>

  <rect class="chip" x="48" y="1042" width="560" height="26" rx="13" />
  <text class="small" x="64" y="1060">
    关键原则：缩放/放大时不强行“全展示”，而是提供“可滚动可达性”（不被地图滚轮吞）
  </text>
</svg>

