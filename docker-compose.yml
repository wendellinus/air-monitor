version: '3.8'
services:
  postgres:
    image: postgres:16
    container_name: go-practice-db
    environment:
      POSTGRES_DB: go_practice_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.2
    container_name: go-practice-redis
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:



